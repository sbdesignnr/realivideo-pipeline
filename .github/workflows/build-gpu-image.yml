name: build-gpu-image

# Zostaví GPU image (OpenSplat + CUDA + libtorch) a pushne ho do ghcr.io.
# Spúšťa sa ručne (Actions -> build-gpu-image -> Run workflow) alebo pri zmene
# Dockerfile.gpu na vetve main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.gpu'
      - '.github/workflows/build-gpu-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write        # potrebné na push do ghcr.io

    steps:
      # Image má ~18 GB. Runner má vo východiskovom stave málo miesta,
      # takže najprv vyhodíme predinštalované SDK, ktoré nepotrebujeme.
      - name: Uvoľniť miesto na disku
        run: |
          echo "pred:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          echo "po:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prihlásiť sa do ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatický, netreba nič nastavovať

      # ghcr.io vyžaduje názvy malými písmenami
      - name: Zostaviť názov image-u
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/realivideo-gpu" >> "$GITHUB_OUTPUT"

      - name: Build a push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          provenance: false      # RunPod si s attestation manifestmi nerozumie

      - name: Zhrnutie
        run: |
          echo "### Image zostavený" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.img.outputs.name }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Pred nasadením na RunPod nastav balíček na **public**, inak si ho pod nestiahne." >> $GITHUB_STEP_SUMMARY
